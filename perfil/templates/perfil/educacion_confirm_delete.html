{% extends 'core/base.html' %}

{% block title %}Eliminar Educación — CV Adaptable{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-custom p-4 text-center">
            <i class="fa-solid fa-graduation-cap text-danger fs-1 mb-3"></i>
            <h4 class="fw-bold">¿Eliminar Registro Académico?</h4>
            <p class="text-muted">Estás a punto de eliminar el título <strong>"{{ object.titulo }} — {{ object.institucion }}"</strong>.</p>

            <form method="post" class="mt-3">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'perfil:educacion_lista' %}" class="btn btn-outline-secondary px-4">Cancelar</a>
                    <button type="submit" class="btn btn-danger px-4 fw-semibold">Sí, Eliminar</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
