<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — CV Adaptable</title>
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #11cdef 0%, #1171ef 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(17, 113, 239, 0.18);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 420px;
        }

        .login-card h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: #1171ef;
            margin-bottom: 0.25rem;
        }

        .login-card p.subtitle {
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .btn-cv-primary {
            background: linear-gradient(135deg, #11f577 0%, #0ba85d 100%);
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 0.6rem 1.5rem;
            border-radius: 8px;
            width: 100%;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn-cv-primary:hover {
            opacity: 0.9;
            color: #fff;
        }

        .form-control:focus {
            border-color: #1171ef;
            box-shadow: 0 0 0 0.2rem rgba(17, 113, 239, 0.15);
        }

        label.error {
            color: #dc3545;
            font-size: 0.82rem;
            margin-top: 0.25rem;
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>CV Adaptable</h1>
        <p class="subtitle">Ingresa tus credenciales para continuar.</p>

        <!-- Mensajes de error no específicos de campo (Req. 1.2, 1.7) -->
        {% if form.non_field_errors %}
            <div class="alert alert-danger py-2" role="alert">
                {% for error in form.non_field_errors %}
                    {{ error }}
                {% endfor %}
            </div>
        {% endif %}

        <!-- CSRF token incluido (Req. 1.6) -->
        <form id="login-form" method="post" action="{% url 'core:login' %}" novalidate>
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold">Usuario</label>
                <input
                    type="text"
                    id="id_username"
                    name="username"
                    class="form-control {% if form.username.errors %}is-invalid{% endif %}"
                    value="{{ form.username.value|default:'' }}"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label fw-semibold">Contraseña</label>
                <input
                    type="password"
                    id="id_password"
                    name="password"
                    class="form-control {% if form.password.errors %}is-invalid{% endif %}"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-cv-primary">Iniciar sesión</button>
        </form>
    </div>

    <!-- jQuery + jQuery Validate (Req. 1.6 — validación en tiempo real) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.20.0/dist/jquery.validate.min.js"></script>
    <script>
        $('#login-form').validate({
            rules: {
                username: { required: true },
                password: { required: true }
            },
            messages: {
                username: { required: 'El nombre de usuario es obligatorio.' },
                password: { required: 'La contraseña es obligatoria.' }
            },
            errorElement: 'label',
            errorClass: 'error',
            highlight: function(element) {
                $(element).addClass('is-invalid');
            },
            unhighlight: function(element) {
                $(element).removeClass('is-invalid');
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
